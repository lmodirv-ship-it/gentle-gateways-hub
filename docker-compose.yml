# قاعدة بيانات محلية بديلة (Postgres فقط، للفحص عبر psql/pgAdmin).
# للتشغيل الكامل مع Auth استخدم Supabase CLI:  supabase start
services:
  postgres:
    image: postgres:15-alpine
    container_name: hn-groupe-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hn_groupe
    ports:
      - "54322:5432"
    volumes:
      - hn_pgdata:/var/lib/postgresql/data
      - ./supabase/migrations:/docker-entrypoint-initdb.d/migrations:ro

  adminer:
    image: adminer:latest
    container_name: hn-groupe-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - postgres

volumes:
  hn_pgdata:
